# Local learning values; tune using observed usage, not production sizing advice.
# requests: capacity used for scheduling; limits: runtime usage ceiling.
# CPU: 100m = 0.1 core. Memory/disk: Mi and Gi are binary units.
# ephemeral-storage covers writable container files and logs, NOT images or PVC data.
# Exceeding memory can cause OOM termination; CPU is throttled; disk can cause eviction.
# Node CPU/RAM/disk are configured outside this file (Minikube / EKS node settings).
apiVersion: v1
kind: Namespace
metadata:
  name: task-board
---
# Create the database Secret from backend/.env before applying this file.
# DATABASE_URL points to your external PostgreSQL database.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: task-board
spec:
  replicas: 2 # Number of desired pods; frontend/backend can be scaled independently.
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: tasks-backend:local
          imagePullPolicy: Never
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
              ephemeral-storage: "64Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
              ephemeral-storage: "256Mi"
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: database
                  key: DATABASE_URL
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8080
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: task-board
spec:
  selector:
    app: backend
  ports:
    - port: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: task-board
spec:
  replicas: 2 # Number of desired pods; frontend/backend can be scaled independently.
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: tasks-frontend:local
          imagePullPolicy: Never
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
              ephemeral-storage: "64Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
              ephemeral-storage: "256Mi"
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: task-board
spec:
  selector:
    app: frontend
  ports:
    - port: 80
